spring.application.name=RevHireP2

# Oracle DB Configuration
spring.datasource.url=jdbc:oracle:thin:@localhost:1521/FREE
spring.datasource.username=system
spring.datasource.password=rahul
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.OracleDialect


# JWT Configuration
app.jwtSecret=RevHireSuperSecretKeyForJwtAuthenticationWhichMustBeAtLeast256BitsLong2023!
app.jwtExpirationMs=86400000

# File Upload Settings (Max 2MB)
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB

# Server Port
server.port=8080

# Logging Configuration
logging.file.name=logs/revhire.log
logging.level.com.rev.app=DEBUG
logging.level.org.springframework.security=DEBUG
