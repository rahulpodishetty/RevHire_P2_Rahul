<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found - RevHire</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Outfit', sans-serif;
            background-color: #f8fafc;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .error-card {
            text-align: center;
            max-width: 500px;
            padding: 40px;
            background: white;
            border-radius: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.05);
        }

        .error-code {
            font-size: 8rem;
            font-weight: 800;
            background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            line-height: 1;
            margin-bottom: 20px;
        }
    </style>
</head>

<body>
    <div class="error-card">
        <div class="error-code">404</div>
        <h2 class="fw-bold mb-3">Page not found.</h2>
        <p class="text-muted mb-5 opacity-75">The page you're looking for doesn't exist or has been moved. Let's get you
            back on track.</p>
        <a href="/" class="btn btn-primary px-5 rounded-pill fw-bold"
            style="background: #4f46e5; border: none; padding: 12px 35px;">Go Back Home</a>
    </div>
</body>

</html>
