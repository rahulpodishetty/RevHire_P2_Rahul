<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Server Error - RevHire</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg-color: #f8fafc;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .error-card {
            text-align: center;
            max-width: 500px;
            padding: 48px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            border: 1px solid #e2e8f0;
        }

        .error-code {
            font-size: 8rem;
            font-weight: 800;
            color: var(--primary);
            line-height: 1;
            margin-bottom: 20px;
        }

        .btn-primary {
            background-color: var(--primary);
            border: none;
            padding: 12px 32px;
            border-radius: 8px;
            font-weight: 600;
        }

        .btn-primary:hover {
            background-color: var(--primary-hover);
        }
    </style>
</head>

<body>
    <div class="error-card">
        <div class="error-code">500</div>
        <h2 class="fw-bold mb-3">Something went wrong.</h2>
        <p class="text-muted mb-4">We encountered an internal error. Our team is working on it.</p>
        <div th:if="${errorMessage}"
            class="alert alert-light border small text-start mb-4 bg-light font-monospace py-3 px-4 rounded-3"
            th:text="${errorMessage}"></div>
        <a href="/" class="btn btn-primary">Go Back Home</a>
    </div>
</body>

</html>
