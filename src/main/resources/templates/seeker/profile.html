<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: header('My Profile - RevHire')}"></head>

<body>
    <div th:replace="~{fragments/layout :: sidebar('profile', ${role})}"></div>
    <div th:replace="~{fragments/layout :: navbar}"></div>

    <main class="main-content">
        <div class="row mb-5 align-items-center">
            <div class="col-lg-6">
                <h2 class="fw-bold mb-1">My Career Profile</h2>
                <p class="text-muted mb-0">Manage your personal information and profile visibility.</p>
            </div>
        </div>

        <div th:if="${param.updated}"
            class="alert alert-success border-0 shadow-sm rounded-4 mb-4 p-3 animate__animated animate__fadeIn">
            <div class="d-flex align-items-center gap-3">
                <i class="fas fa-check-circle fs-4"></i>
                <div>
                    <h6 class="fw-bold mb-0">Profile Updated!</h6>
                    <p class="small mb-0 opacity-75">Your career profile has been successfully updated.</p>
                </div>
                <button type="button" class="btn-close ms-auto" data-bs-dismiss="alert"></button>
            </div>
        </div>

        <div class="row">
            <div class="col-lg-4">
                <div class="card border-0 shadow-sm rounded-4 text-center p-4 mb-4">
                    <div class="card-body">
                        <div class="position-relative d-inline-block mb-4">
                            <div class="bg-primary-subtle p-4 rounded-circle border border-2 border-white shadow-sm"
                                style="width: 120px; height: 120px; display: flex; align-items: center; justify-content: center;">
                                <i class="fas fa-user text-primary fs-1"></i>
                            </div>
                            <button
                                class="btn btn-primary btn-sm rounded-circle position-absolute bottom-0 end-0 shadow-sm p-2"
                                style="width: 32px; height: 32px; display: flex; align-items: center; justify-content: center;"><i
                                    class="fas fa-camera small"></i></button>
                        </div>
                        <h5 class="fw-bold mb-1" th:text="${profile.name}">Johnathan Doe</h5>
                        <p class="small text-muted mb-4" th:text="${profile.user.email}">j.doe@example.com</p>
                        <div class="d-flex justify-content-center gap-2 mb-4">
                            <span class="badge bg-light text-primary px-3 py-2 rounded-pill fw-bold border"
                                th:text="${profile.currentEmploymentStatus ?: 'Job Seeker'}">Job Seeker</span>
                        </div>
                        <div class="mt-4">
                            <div class="d-flex justify-content-between align-items-center mb-2">
                                <span class="small fw-bold text-muted text-uppercase">Profile Strength</span>
                                <span class="small fw-bold text-primary"
                                    th:text="${profile.profileCompletion + '%'}">75%</span>
                            </div>
                            <div class="progress rounded-pill" style="height: 8px;">
                                <div class="progress-bar progress-bar-striped progress-bar-animated bg-primary"
                                    role="progressbar" th:style="'width: ' + ${profile.profileCompletion} + '%'"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-lg-8">
                <div class="card border-0 shadow-sm rounded-4 overflow-hidden mb-5">
                    <div class="card-body p-5">
                        <h5 class="fw-bold mb-4">Professional Profile</h5>
                        <form th:action="@{/seeker/profile}" method="post" class="row g-4">
                            <div class="col-md-6">
                                <label class="form-label fw-bold small text-uppercase text-muted">Full Name</label>
                                <input type="text" name="name" class="form-control bg-light border-0 py-3 rounded-3"
                                    th:value="${profile.name}" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-bold small text-uppercase text-muted">Phone Number</label>
                                <input type="text" name="phone" class="form-control bg-light border-0 py-3 rounded-3"
                                    th:value="${profile.phone}" placeholder="Enter phone number">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-bold small text-uppercase text-muted">Location</label>
                                <input type="text" name="location" class="form-control bg-light border-0 py-3 rounded-3"
                                    th:value="${profile.location}" placeholder="City, Country">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-bold small text-uppercase text-muted">Employment
                                    Status</label>
                                <select name="currentEmploymentStatus"
                                    class="form-select bg-light border-0 py-3 rounded-3">
                                    <option value="Unemployed"
                                        th:selected="${profile.currentEmploymentStatus == 'Unemployed'}">Unemployed /
                                        Looking</option>
                                    <option value="Employed"
                                        th:selected="${profile.currentEmploymentStatus == 'Employed'}">Employed / Open
                                        to Opportunities</option>
                                    <option value="Student"
                                        th:selected="${profile.currentEmploymentStatus == 'Student'}">Student</option>
                                    <option value="Freelancer"
                                        th:selected="${profile.currentEmploymentStatus == 'Freelancer'}">Freelancer
                                    </option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-bold small text-uppercase text-muted">Years of
                                    Experience</label>
                                <input type="number" name="experienceYears"
                                    class="form-control bg-light border-0 py-3 rounded-3"
                                    th:value="${profile.experienceYears != null ? profile.experienceYears : 0}"
                                    required>
                            </div>
                            <div class="col-12">
                                <label class="form-label fw-bold small text-uppercase text-muted">Skills (Comma
                                    Separated)</label>
                                <textarea name="skills" class="form-control bg-light border-0 py-3 rounded-3" rows="2"
                                    placeholder="Java, Spring Boot, SQL, AWS..." th:text="${profile.skills}"></textarea>
                            </div>
                            <div class="col-md-12">
                                <label class="form-label fw-bold small text-uppercase text-muted">Education</label>
                                <textarea name="education" class="form-control bg-light border-0 py-3 rounded-3"
                                    rows="3" placeholder="Degree, University, Year..."
                                    th:text="${profile.education}"></textarea>
                            </div>
                            <div class="col-md-12">
                                <label class="form-label fw-bold small text-uppercase text-muted">Work Experience
                                    Details</label>
                                <textarea name="workExperience" class="form-control bg-light border-0 py-3 rounded-3"
                                    rows="4" placeholder="Describe your previous roles and responsibilities..."
                                    th:text="${profile.workExperience}"></textarea>
                            </div>
                            <div class="col-md-12">
                                <label class="form-label fw-bold small text-uppercase text-muted">Certifications</label>
                                <textarea name="certifications" class="form-control bg-light border-0 py-3 rounded-3"
                                    rows="2" placeholder="AWS Certified, Java OCP..."
                                    th:text="${profile.certifications}"></textarea>
                            </div>
                            <div class="col-md-12">
                                <label class="form-label fw-bold small text-uppercase text-muted">Projects</label>
                                <textarea name="projects" class="form-control bg-light border-0 py-3 rounded-3" rows="3"
                                    placeholder="E-Commerce App, Portfolio Website..."
                                    th:text="${profile.projects}"></textarea>
                            </div>
                            <div class="col-md-12 text-end pt-4">
                                <button type="submit"
                                    class="btn btn-primary rounded-pill px-5 py-3 fw-bold shadow-sm">Save Profile
                                    Changes</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
