<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: header('Notifications - RevHire')}"></head>

<body>
    <div th:replace="~{fragments/layout :: sidebar('notifications', ${role})}"></div>
    <div th:replace="~{fragments/layout :: navbar}"></div>

    <main class="main-content">
        <div class="row mb-5">
            <div class="col-lg-12">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div>
                        <h2 class="fw-bold mb-1">Your Notifications</h2>
                        <p class="text-muted">Stay updated with your job applications and recommendations.</p>
                    </div>
                </div>

                <div class="card border-0 shadow-sm rounded-4 overflow-hidden">
                    <div class="card-body p-0">
                        <div id="fullNotificationList" class="list-group list-group-flush">
                            <!-- JS will load these -->
                            <div class="p-5 text-center text-muted">
                                <div class="spinner-border text-primary mb-3" role="status"></div>
                                <p>Checking for notifications...</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', fetchFullNotifications);

        async function fetchFullNotifications() {
            const list = document.getElementById('fullNotificationList');
            try {
                const response = await fetch('/api/notifications');
                const data = await response.json();

                if (data.length === 0) {
                    list.innerHTML = `
                        <div class="p-5 text-center py-5">
                            <i class="fas fa-bell-slash text-muted opacity-25 mb-3" style="font-size: 3rem;"></i>
                            <h5 class="fw-bold">No notifications found</h5>
                            <p class="text-muted">We'll notify you when something important happens.</p>
                            <a href="/seeker/jobs" class="btn btn-primary rounded-pill px-4 mt-2">Find More Jobs</a>
                        </div>
                    `;
                    return;
                }

                // Sort by date desc
                data.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));

                list.innerHTML = data.map(function (n) {
                    var borderClass = n.isRead ? 'border-light' : 'border-primary bg-light-primary';
                    var iconClass = n.type === 'JOB_RECOMMENDATION' ? 'fa-sparkles' : 'fa-info-circle';
                    var title = n.type === 'JOB_RECOMMENDATION' ? 'Job Recommendation' : 'Application Status Update';
                    var statusBadge = !n.isRead ?
                        '<button onclick="markAsReadAndRefresh(' + n.id + ')" class="btn btn-link btn-sm text-decoration-none fw-bold p-0">Mark as read</button>' :
                        '<span class="badge bg-light text-muted fw-normal">Read</span>';

                    return '<div class="list-group-item p-4 border-start border-4 ' + borderClass + '">' +
                        '<div class="d-flex justify-content-between align-items-start">' +
                        '<div class="d-flex gap-4">' +
                        '<div class="bg-primary bg-opacity-10 p-3 rounded-4 align-self-start">' +
                        '<i class="fas ' + iconClass + ' text-primary fs-4"></i>' +
                        '</div>' +
                        '<div>' +
                        '<h6 class="fw-bold mb-2">' + title + '</h6>' +
                        '<p class="text-muted mb-2">' + n.message + '</p>' +
                        '<span class="small text-muted opacity-75"><i class="far fa-clock me-1"></i> ' + new Date(n.createdAt).toLocaleString() + '</span>' +
                        '</div>' +
                        '</div>' +
                        statusBadge +
                        '</div>' +
                        '</div>';
                }).join('');
            } catch (err) {
                list.innerHTML = '<div class="p-5 text-center text-danger">Failed to load notifications. Please try again later.</div>';
            }
        }

        async function markAsReadAndRefresh(id) {
            try {
                await fetch('/api/notifications/' + id + '/read', { method: 'POST' });
                if (typeof updateNotificationBadge === 'function') updateNotificationBadge();
                fetchFullNotifications();
            } catch (err) { }
        }
    </script>
</body>

</html>
