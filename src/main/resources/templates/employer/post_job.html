<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: header('Post a New Job - RevHire')}"></head>

<body>
    <div th:replace="~{fragments/layout :: sidebar('post-job', ${role})}"></div>
    <div th:replace="~{fragments/layout :: navbar}"></div>

    <main class="main-content">
        <div class="row mb-5 align-items-center">
            <div class="col-lg-12">
                <nav aria-label="breadcrumb">
                    <ol class="breadcrumb mb-2 small text-muted">
                        <li class="breadcrumb-item"><a href="/employer/dashboard"
                                class="text-decoration-none">Dashboard</a></li>
                        <li class="breadcrumb-item"><a href="/employer/jobs" class="text-decoration-none">My Jobs</a>
                        </li>
                        <li class="breadcrumb-item active" aria-current="page"
                            th:text="${job.id != null ? 'Edit Job' : 'Post New'}">Post New</li>
                    </ol>
                </nav>
                <h2 class="fw-bold mb-1" th:text="${job.id != null ? 'Edit Job Listing' : 'Post a New Job Listing'}">
                    Post a New Job Listing</h2>
                <p class="text-muted mb-0">Outline the requirements and find the perfect candidate today.</p>
            </div>
        </div>

        <div class="card border-0 shadow-sm rounded-4 overflow-hidden mb-5">
            <div class="card-body p-5">
                <form class="row g-4"
                    th:action="${job.id != null ? '/employer/jobs/' + job.id + '/edit' : '/employer/jobs/post'}"
                    th:object="${job}" method="post">

                    <div class="col-md-12">
                        <label class="form-label fw-bold">Job Title</label>
                        <input type="text" th:field="*{title}" class="form-control bg-light border-0 py-3 rounded-3"
                            placeholder="e.g. Senior Java Developer" required>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label fw-bold">Job Type</label>
                        <select th:field="*{jobType}" class="form-select bg-light border-0 py-3 rounded-3" required>
                            <option value="FULL_TIME">Full-time</option>
                            <option value="PART_TIME">Part-time</option>
                            <option value="CONTRACT">Contract</option>
                            <option value="REMOTE">Remote</option>
                        </select>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label fw-bold">Location</label>
                        <input type="text" th:field="*{location}" class="form-control bg-light border-0 py-3 rounded-3"
                            placeholder="e.g. San Francisco, CA or Austin, TX" required>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label fw-bold">Salary Range</label>
                        <input type="text" th:field="*{salaryRange}"
                            class="form-control bg-light border-0 py-3 rounded-3" placeholder="e.g. $120k - $160k"
                            required>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label fw-bold">Application Deadline</label>
                        <input type="date" th:field="*{deadline}" class="form-control bg-light border-0 py-3 rounded-3"
                            required>
                    </div>

                    <div class="col-md-4">
                        <label class="form-label fw-bold">Experience Required (Years)</label>
                        <input type="number" th:field="*{experienceRequired}"
                            class="form-control bg-light border-0 py-3 rounded-3" placeholder="e.g. 5" min="0" required>
                    </div>

                    <div class="col-md-4">
                        <label class="form-label fw-bold">Number of Openings</label>
                        <input type="number" th:field="*{openings}"
                            class="form-control bg-light border-0 py-3 rounded-3" placeholder="e.g. 3" min="1" required>
                    </div>

                    <div class="col-md-4">
                        <label class="form-label fw-bold">Education Qualification</label>
                        <input type="text" th:field="*{educationRequired}"
                            class="form-control bg-light border-0 py-3 rounded-3" placeholder="e.g. Bachelor's in CS">
                    </div>

                    <div class="col-md-12">
                        <label class="form-label fw-bold">Job Description</label>
                        <textarea th:field="*{description}" class="form-control bg-light border-0 py-3 rounded-3"
                            rows="8"
                            placeholder="Outline the job responsibilities, company culture, and role expectations..."
                            required></textarea>
                    </div>

                    <div class="col-md-12">
                        <label class="form-label fw-bold">Skills Required (comma separated)</label>
                        <input type="text" th:field="*{skillsRequired}"
                            class="form-control bg-light border-0 py-3 rounded-3"
                            placeholder="e.g. Java, Spring Boot, MySQL, AWS">
                    </div>

                    <div class="col-md-12 text-end pt-4" th:if="${job.id == null}">
                        <button type="button" class="btn btn-light rounded-pill px-5 py-3 fw-bold me-2">Save as
                            Draft</button>
                        <button type="submit" class="btn btn-primary rounded-pill px-5 py-3 fw-bold shadow-sm">Post Job
                            Listing</button>
                    </div>
                    <div class="col-md-12 text-end pt-4" th:if="${job.id != null}">
                        <a href="/employer/jobs" class="btn btn-light rounded-pill px-5 py-3 fw-bold me-2">Cancel</a>
                        <button type="submit" class="btn btn-success rounded-pill px-5 py-3 fw-bold shadow-sm">Update
                            Job
                            Listing</button>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
