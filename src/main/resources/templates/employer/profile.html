<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: header('My Profile - RevHire')}"></head>

<body>
    <div th:replace="~{fragments/layout :: sidebar('profile', ${role})}"></div>
    <div th:replace="~{fragments/layout :: navbar}"></div>

    <main class="main-content">
        <div class="row mb-5 align-items-center">
            <div class="col-lg-12">
                <nav aria-label="breadcrumb">
                    <ol class="breadcrumb mb-2 small text-muted">
                        <li class="breadcrumb-item"><a href="/employer/dashboard"
                                class="text-decoration-none">Dashboard</a></li>
                        <li class="breadcrumb-item active" aria-current="page">Account Profile</li>
                    </ol>
                </nav>
                <h2 class="fw-bold mb-1">Account Administration</h2>
                <p class="text-muted mb-0">Manage your administrative details and account settings.</p>
            </div>
        </div>

        <div th:if="${param.updated}" class="alert alert-success border-0 rounded-4 mb-4 shadow-sm">
            <i class="fas fa-check-circle me-2"></i> Profile updated successfully!
        </div>

        <div class="row">
            <div class="col-lg-4">
                <div class="card border-0 shadow-sm rounded-4 text-center p-4 mb-4">
                    <div class="card-body">
                        <div class="position-relative d-inline-block mb-4">
                            <div class="bg-indigo-subtle p-4 rounded-circle border border-2 border-white shadow-sm"
                                style="width: 120px; height: 120px; display: flex; align-items: center; justify-content: center; background-color: #e0e7ff;">
                                <i class="fas fa-user-tie text-primary fs-1"></i>
                            </div>
                        </div>
                        <h5 class="fw-bold mb-1" th:text="${profile.company.name}">Company Name</h5>
                        <p class="small text-muted mb-4" th:text="${profile.designation}">Designation</p>
                        <div class="d-flex justify-content-center gap-2 mb-4">
                            <span class="badge bg-light text-primary px-3 py-2 rounded-pill fw-bold border">Employer ID:
                                #<span th:text="${profile.id}">000</span></span>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-lg-8">
                <div class="card border-0 shadow-sm rounded-4 overflow-hidden mb-5">
                    <div class="card-body p-5">
                        <h5 class="fw-bold mb-4">Personal Details</h5>
                        <form class="row g-4" th:action="@{/employer/profile}" th:object="${profile}" method="post">
                            <div class="col-md-12">
                                <label class="form-label fw-bold">Designation</label>
                                <input type="text" th:field="*{designation}"
                                    class="form-control bg-light border-0 py-3 rounded-3" placeholder="e.g. HR Manager"
                                    required>
                            </div>
                            <!-- Note: User email editing is usually restricted for security in many systems -->
                            <div class="col-md-12">
                                <label class="form-label fw-bold">Company Name (Referential)</label>
                                <input type="text" th:value="${profile.company.name}"
                                    class="form-control bg-light border-0 py-3 rounded-3" disabled>
                                <p class="small text-muted mt-1">Update organizational details in the <a
                                        href="/employer/company">Company Portfolio</a> section.</p>
                            </div>

                            <div class="col-md-12 text-end pt-4">
                                <button type="submit"
                                    class="btn btn-primary rounded-pill px-5 py-3 fw-bold shadow-sm">Update Account
                                    Settings</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
