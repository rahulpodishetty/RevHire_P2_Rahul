# H2 in-memory database for testing (Oracle compatibility mode)
spring.datasource.url=jdbc:h2:mem:testdb;MODE=Oracle;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=false

# Disable JWT for test context
app.jwtSecret=TestSecretKeyForJwtAuthenticationWhichMustBeAtLeast256BitsLong2023!
app.jwtExpirationMs=86400000

# Disable logging noise
logging.level.org.hibernate.SQL=WARN
logging.level.org.springframework.security=WARN
